# Performance: the criterion pipeline benches and the headless startup timing,
# on every push to main and every pull request.
#
# Two guards, one trail, nothing outside the repository's own Actions:
# - Every run is compared against the trail and an alert comment is posted on
#   the PR when a bench regresses past the threshold; the job summary shows
#   the numbers either way.
# - The trail is a JSON history per bench, carried forward as a workflow
#   artifact: a run on main restores it from the previous successful main
#   run, appends its own result, and uploads it again. No branch, no bot
#   commits, no GitHub Pages. (Artifacts expire after 90 days, so the chain
#   lives as long as main is pushed within that window; a snapshot committed
#   at release time is the way to keep a point forever.)
# - Every run also uploads its raw output (criterion report, bencher lines,
#   startup JSON) as its own artifact.
#
# What gates and what informs. The pipeline's cost in *instructions retired*
# per render (cachegrind, scripts/bench-instructions.sh) is deterministic —
# runner type and CPU frequency do not move it — so it fails the job at 105%.
# The one thing that does move it without a code change is the compiler: the
# container installs Arch's current rust on every run, and a rustc upgrade
# shifts codegen by a few percent. An alert on a commit that touched nothing
# in src/core, on a run whose pacman step installed a newer rust than the
# previous run, is that — read the two runs' pacman output before chasing it.
# The two wall-clock measurements are the numbers a reader feels, but shared
# runners move them ±30% between instances (measured), so they only comment:
# criterion at 130%, startup timing at 150%.
name: bench

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"

jobs:
  bench:
    name: pipeline benches + startup timing
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install toolchain, system libraries and the headless harness
        run: >-
          pacman -Syu --noconfirm --needed
          rust mold gtk4 webkitgtk-6.0 git github-cli valgrind
          xorg-server-xvfb dbus glib2 mesa
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # The trail from the last successful run on main; an empty trail on the
      # very first run (the action starts one from nothing).
      - name: Restore the trail from the previous main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p trail
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bench.yml --branch main \
                   --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$last" ]; then
            gh run download "$last" --repo "$GITHUB_REPOSITORY" -n bench-trail -D trail \
              && echo "trail restored from run $last" \
              || echo "run $last carried no trail artifact; starting fresh"
          else
            echo "no previous successful main run; starting a fresh trail"
          fi
          ls -l trail || true

      - name: Pipeline benches (criterion, libtest-style output)
        # bash for pipefail: a build failure must fail the step, not hide
        # behind tee's exit code and hand the action an empty file.
        #
        # target/criterion is wiped first: the build cache can restore a stale
        # copy, and criterion then compares against it and prints errors into
        # the middle of the bencher lines the action parses. Comparing across
        # runs is the trail's job, not criterion's.
        shell: bash
        run: |
          set -o pipefail
          rm -rf target/criterion
          cargo bench --bench pipeline -- --output-format bencher | tee pipeline.txt

      - name: Pipeline instruction counts (cachegrind)
        run: scripts/bench-instructions.sh -j instructions.json

      - name: Startup timing (headless, median of 7)
        run: scripts/bench-startup.sh -n 7 -j startup.json

      - name: Upload this run's raw results
        uses: actions/upload-artifact@v4
        with:
          name: bench-raw-${{ github.sha }}
          path: |
            pipeline.txt
            instructions.json
            startup.json
            target/criterion
          if-no-files-found: error
          retention-days: 90

      - name: Compare and record pipeline instruction counts (the gate)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: instructions
          tool: customSmallerIsBetter
          output-file-path: instructions.json
          external-data-json-path: trail/instructions.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          save-data-file: ${{ github.event_name == 'push' }}
          alert-threshold: "105%"
          comment-on-alert: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
          fail-on-alert: true
          summary-always: true

      - name: Compare and record pipeline wall clock
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: pipeline
          tool: cargo
          output-file-path: pipeline.txt
          external-data-json-path: trail/pipeline.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          save-data-file: ${{ github.event_name == 'push' }}
          alert-threshold: "130%"
          comment-on-alert: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
          fail-on-alert: false
          summary-always: true

      - name: Compare and record startup timing
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: startup
          tool: customSmallerIsBetter
          output-file-path: startup.json
          external-data-json-path: trail/startup.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          save-data-file: ${{ github.event_name == 'push' }}
          alert-threshold: "150%"
          comment-on-alert: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
          fail-on-alert: false
          summary-always: true

      # Only a run on main extends the chain; a PR run compares and stops.
      - name: Carry the trail forward
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bench-trail
          path: trail
          if-no-files-found: error
          retention-days: 90
