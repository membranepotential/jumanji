# Performance: the criterion pipeline benches and the headless startup timing,
# on every push to main and every pull request.
#
# Two guards, one trail, all inside the repository:
# - Every run is compared against the stored history and an alert comment is
#   posted on the PR when a bench regresses past the threshold; the job
#   summary shows the numbers either way.
# - On main, the results are appended to the trail on the `bench-data`
#   branch (a JSON history per bench, plus the action's stock chart page as a
#   plain file — no GitHub Pages, nothing published), so a slow drift is
#   visible even when no single change trips the alert.
# - Every run uploads its raw output (criterion report, the bencher lines,
#   the startup JSON) as a workflow artifact.
#
# Thresholds are deliberately loose: shared runners are noisy, and the point
# is to catch a real regression, not to fail the build on a scheduler hiccup.
# The pipeline benches are pure CPU work and fail the job at 130%; the startup
# timing spawns a WebKit process and only comments, at 150%.
name: bench

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"

jobs:
  bench:
    name: pipeline benches + startup timing
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install toolchain, system libraries and the headless harness
        run: >-
          pacman -Syu --noconfirm --needed
          rust mold gtk4 webkitgtk-6.0 git
          xorg-server-xvfb dbus glib2 mesa
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2

      # The benchmark action reads and writes the trail on its data branch and
      # needs the branch to exist; create it once, empty, on the first run.
      - name: Ensure the bench-data trail branch exists
        if: github.event_name == 'push'
        # An empty root commit pushed straight from the object store: no
        # checkout, so the working tree the benches run in is never touched.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git ls-remote --exit-code --heads origin bench-data >/dev/null; then
            export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
            export GIT_AUTHOR_EMAIL="github-actions[bot]@users.noreply.github.com"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            root=$(git commit-tree "$(git hash-object -t tree /dev/null)" -m "bench trail")
            git push origin "$root:refs/heads/bench-data"
          fi

      - name: Pipeline benches (criterion, libtest-style output)
        run: cargo bench --bench pipeline -- --output-format bencher | tee pipeline.txt

      - name: Startup timing (headless, median of 7)
        run: scripts/bench-startup.sh -n 7 -j startup.json

      - name: Upload the raw results
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: |
            pipeline.txt
            startup.json
            target/criterion
          if-no-files-found: error

      - name: Record pipeline benches
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: pipeline
          tool: cargo
          output-file-path: pipeline.txt
          gh-pages-branch: bench-data
          benchmark-data-dir-path: pipeline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          save-data-file: ${{ github.event_name == 'push' }}
          alert-threshold: "130%"
          comment-on-alert: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
          fail-on-alert: true
          summary-always: true

      - name: Record startup timing
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: startup
          tool: customSmallerIsBetter
          output-file-path: startup.json
          gh-pages-branch: bench-data
          benchmark-data-dir-path: startup
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          save-data-file: ${{ github.event_name == 'push' }}
          alert-threshold: "150%"
          comment-on-alert: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
          fail-on-alert: false
          summary-always: true
