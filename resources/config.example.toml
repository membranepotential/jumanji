# Example jumanji configuration.
#
# Install to ~/.config/jumanji/config.toml (or $XDG_CONFIG_HOME/jumanji/config.toml).
# Every key below is shown commented-out at its built-in default, so an empty
# file (or one with only the options you care about) behaves identically to
# this file fully commented out.
#
# The file has two top-level tables: [options] for rendering/interaction
# settings, and [keys.<mode>] for key remaps. Unknown keys and misplaced
# top-level options are a hard parse error (not silently ignored), so typos
# get caught instead of swallowed.

[options]

# Pixels scrolled per j/k/h/l, before count multiplication (e.g. `5j`).
# scroll-step = 60

# Geometric zoom step: added to/subtracted from the webkit zoom level per
# `zoom in`/`zoom out` step (bound to `+`/`-` by default... see note below).
# zoom-step = 0.1

# Text zoom step: fraction of the base font size added/removed per
# `text zoom in`/`text zoom out` step. Anchors the reading position instead
# of jumping the scroll offset.
# text-zoom-step = 0.1

# Rendered content column width, in pixels.
# page-width = 720

# Whether dark-mode recoloring is on at startup (toggle at runtime with
# Ctrl-r / the `recolor` action).
# default-recolor = false

# Whether a document's YAML frontmatter is shown, as a properties table.
# Hidden by default, so a note opens as prose; toggle at runtime with
# `:frontmatter`.
# show-frontmatter = false

# Body/prose font family. Empty string means "use the stylesheet's default
# serif stack" (currently Source Serif 4, falling back to the system serif).
# font-body = ""

# Monospace/code font family. Empty string means "use the stylesheet's
# default monospace stack".
# font-mono = ""

# Base body font size in pixels. Also the 100% reference point for text zoom.
# font-size = 18

# What a node's children are in the document graph (`t`): "links" — every
# document it links to, so a node can appear more than once, with nodes off
# the route starting folded — or "tree", the spanning tree of documents
# reachable from where you started, every node once and unfolded. `v` switches
# while the graph is open; `:set graph-view` changes an open graph too.
# graph-view = "links"

# The colour of a text selection, and so of the current `/` match. zathura's
# `highlight-color` and default; takes #rgb, #rrggbb, #rrggbbaa, rgb(…), rgba(…).
# highlight-color = "rgba(159, 251, 0, 0.5)"

# Which system selection a copied text selection is written to, zathura-style:
# "primary" (X11 PRIMARY, middle-click paste) or "clipboard" (Ctrl-V paste).
# selection-clipboard = "primary"

# Reverse editor sync (DESIGN D7): the command run on a Ctrl+click, to open your
# editor at the clicked element's source line. `%l` is the line, `%f` the file
# path (`%%` is a literal `%`), zathura's synctex-placeholder style. A leading
# `$VAR` is expanded from the environment, and the spawn is argv-based (not a
# shell), so a file path with spaces stays a single argument. The complement is
# forward sync: `jumanji --forward <line> file.md` points an already-open reader
# (or a fresh one) at that source line — wire it into your editor to jump both
# ways. Examples: "nvim +%l %f", "code -g %f:%l", "gvim --remote +%l %f".
# editor-command = "$EDITOR +%l %f"

# External fence renderers (DESIGN D6.2). Each key is a fenced-code-block
# language token; the value is a shell command run via `sh -c` with the fence
# body piped in on stdin. Whatever the command writes to stdout (SVG or HTML)
# replaces the fence, wrapped in a horizontal-scroll box. This is the same
# pipeline seam the built-in mermaid renderer occupies — no plugin API.
#
# Language matching is case-insensitive. A command that fails (non-zero exit,
# a 5-second timeout, >4 MiB of output, or empty/non-UTF-8 output) degrades
# gracefully: the fence falls back to a highlighted code block plus an error
# note, never a crash. Renderers re-run on live reload. A renderer keyed on
# "mermaid" overrides the built-in mermaid diagram support.
#
# jumanji runs whatever you configure here (as zathura trusts its plugins);
# only add commands you trust. Examples (uncomment and adjust to taste):
#
# [renderers]
# d2 = "d2 - -"                    # https://d2lang.com  (```d2 fences)
# dot = "dot -Tsvg"               # Graphviz            (```dot fences)
# graphviz = "dot -Tsvg"          #   alias for the same
# typst = "typst compile - -"     # Typst → SVG         (```typst fences)

# Key tables, one per mode: [keys.normal], [keys.toc] (the table of contents,
# opened with Tab) and [keys.graph] (the document graph, opened with `t`).
# Zathura key notation: bare chars are literal (`gg`, `J`); angle brackets
# denote specials and modifiers (<C-r>, <Tab>, <CR>, <BS>, <Esc>, <Space>,
# <Up>, <Down>, <Left>, <Right>, <S-Tab>). A count prefix (`5j`) works with every binding.
#
# Every binding below is the built-in default. Uncomment a line and edit it to
# override that key; keys you leave out keep their defaults. `mark set` and
# `mark jump` take the next typed character as the register (`ma`, `'a`).

[keys.normal]
# "j" = "scroll down"
# "k" = "scroll up"
# "h" = "scroll left"
# "l" = "scroll right"
# "d" = "half-page down"
# "u" = "half-page up"
# "J" = "section next"
# "K" = "section previous"
# "gg" = "goto top"
# "G" = "goto bottom"              # <count>G jumps to section <count>
# "+" = "zoom in"
# "-" = "zoom out"
# "=" = "zoom reset"
# "/" = "search"
# "n" = "search next"
# "N" = "search previous"
# "<C-r>" = "recolor"
# "r" = "reload"
# "s" = "toggle wide"
# "a" = "toggle diagram fit"
# "<Tab>" = "toggle toc"
# ":" = "command line"
# "f" = "follow link"
# "F" = "show link target"
# "m" = "mark set"
# "'" = "mark jump"
# "<C-o>" = "jump backward"
# "<C-i>" = "jump forward"
# "<BS>" = "jump backward"
# "<Esc>" = "abort"
# "t" = "toggle graph"
# "q" = "quit"
#
# Actions with no default key (bind one here if you want it): toggle
# frontmatter, text zoom in, text zoom out.

# [keys.toc]
# "j" = "toc next"
# "k" = "toc previous"
# "l" = "toc expand"
# "h" = "toc collapse"
# "<CR>" = "toc select"
# "<Tab>" = "toggle toc"
# "q" = "quit"

# [keys.graph]
# "j" = "graph next"
# "k" = "graph previous"
# "h" = "graph parent"               # move to the parent; never folds
# "l" = "graph child"                # move to a child, unfolding a folded node
# "<Down>" = "graph next"
# "<Up>" = "graph previous"
# "<Left>" = "graph parent"
# "<Right>" = "graph child"
# "<Space>" = "graph fold"           # fold / unfold the selected node
# "<CR>" = "graph open"
# "v" = "graph view"
# "<Tab>" = "toggle toc"             # the table of contents; closes the graph
# ":" = "command line"
# "+" = "zoom in"
# "-" = "zoom out"
# "=" = "zoom reset"
# "t" = "toggle graph"
# "q" = "quit"
